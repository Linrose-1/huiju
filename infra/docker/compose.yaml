services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: huiju
      MYSQL_USER: huiju
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:-huiju_local_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:-huiju_root_local_dev}
    ports:
      - "127.0.0.1:${MYSQL_DEV_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
